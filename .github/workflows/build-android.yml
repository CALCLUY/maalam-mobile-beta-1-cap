name: build-android

# Builds the Maalam APK/AAB. This is the supported way to obtain binaries: it
# needs a JDK 21 + Android SDK 36 + unrestricted network, which GitHub-hosted
# runners provide.
#
# Artifacts produced on every run:
#   maalam-debug-apk        installable debug build (chrome://inspect enabled)
#   maalam-release          app-release.apk + app-release.aab + mapping.txt
#   reference-screenshots/  390x844 @2x captures of every reachable screen
#   web-dist                the exact dist/ that was packaged
#
# Delivery of the binaries (the Actions artifact CDN is not reachable from every
# environment, so the APK is published three ways):
#   1. GitHub Release "maalam-android-latest"  <- easiest: a permanent URL
#      https://github.com/CALCLUY/maalam-mobile-beta-1-cap/releases
#   2. maalam-android/artifacts/maalam-debug.apk committed to the branch
#      ([skip ci]) so `git pull` fetches the binary
#   3. the run artifacts listed above
#
# Gradle failures are echoed into the job summary, which is readable through the
# check-run API (`gh api repos/:owner/:repo/check-runs/:job_id --jq .output.summary`).
#
# Release signing: set repository secrets MAALAM_KEYSTORE_B64 (base64 of the
# .keystore/.jks), MAALAM_KEYSTORE_PASSWORD, MAALAM_KEY_ALIAS and
# MAALAM_KEY_PASSWORD. Without them the job generates an EPHEMERAL keystore so
# the release build still verifies; such an APK must not go to Play.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  web:
    name: Web build + CDN gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maalam-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: maalam-android/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: No-CDN gate
        run: npm run verify:offline

      - name: Sizes into job summary
        run: |
          {
            echo "## dist/ composition"
            echo '```'
            du -sh dist
            find dist -type f | wc -l
            ls -S dist/assets | head -12
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: maalam-android/dist
          retention-days: 7

  reference:
    name: Reference screenshots (390x844 @2x)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: maalam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: maalam-android/package-lock.json

      - name: Install (app + Playwright browser)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build + serve
        run: |
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

      - name: Capture
        run: npm run reference
        env:
          MAALAM_REF_URL: http://127.0.0.1:4173

      - name: Capture log into job summary
        if: always()
        run: |
          {
            echo "## reference capture"
            echo '```'
            ls -la reference/*.png 2>/dev/null || echo "no PNGs produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reference-screenshots
          path: maalam-android/reference/*.png
          if-no-files-found: warn
          retention-days: 30

  apk:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: maalam-android
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the APK-publishing step can push back to the branch.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: maalam-android/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK 36 + build-tools
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Install + build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.MAALAM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MAALAM_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MAALAM_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.MAALAM_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore ~/.gradle
          KS_PATH="$GITHUB_WORKSPACE/maalam-android/android/keystore/release.keystore"
          if [ -n "$KS_B64" ]; then
            base64 --decode > "$KS_PATH" <<<"$KS_B64"
            echo "Using the repository release keystore."
          else
            KS_PATH="$GITHUB_WORKSPACE/maalam-android/android/keystore/ci-test.keystore"
            keytool -genkeypair -v -keystore "$KS_PATH" -storetype pkcs12 \
              -storepass ci-test-pass -alias ci-test -keypass ci-test-pass \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=Maalam CI, OU=Test, O=CALCLUY, C=MA" >/dev/null
            KS_PASS=ci-test-pass; KS_ALIAS=ci-test; KS_KEYPASS=ci-test-pass
            echo "::warning::No MAALAM_KEYSTORE_* secrets configured - release is signed with an EPHEMERAL CI keystore (fine for device testing, NOT for Play)."
          fi
          {
            echo "maalam.keystorePath=$KS_PATH"
            echo "maalam.keystorePassword=$KS_PASS"
            echo "maalam.keyAlias=$KS_ALIAS"
            echo "maalam.keyPassword=$KS_KEYPASS"
          } >> ~/.gradle/gradle.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('maalam-android/android/**/*.gradle', 'maalam-android/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Debug APK
        id: gradleDebug
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          cd android && ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-debug.log

      - name: Release APK + AAB (R8)
        id: gradleRelease
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          cd android && ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-release.log

      - name: Gradle diagnostics into job summary
        if: always()
        run: |
          {
            echo "## Gradle results"
            echo "- assembleDebug: **${{ steps.gradleDebug.outcome }}**"
            echo "- assembleRelease + bundleRelease: **${{ steps.gradleRelease.outcome }}**"
            for f in /tmp/gradle-debug.log /tmp/gradle-release.log; do
              [ -f "$f" ] || continue
              echo
              echo "### $(basename "$f") — failures"
              echo '```'
              grep -nE "FAILURE|What went wrong|Execution failed|error:|ERROR|Caused by|FAILED|A problem occurred" "$f" | head -60 || echo "(no matching lines)"
              echo '```'
              echo "### $(basename "$f") — tail"
              echo '```'
              tail -n 90 "$f"
              echo '```'
            done
            echo
            echo "### Outputs"
            echo '```'
            find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -la {} \; 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage binaries with friendly names
        if: always()
        run: |
          mkdir -p artifacts
          cp -v android/app/build/outputs/apk/debug/app-debug.apk artifacts/maalam-debug.apk 2>/dev/null || true
          cp -v android/app/build/outputs/apk/release/app-release.apk artifacts/maalam-release.apk 2>/dev/null || true
          cp -v android/app/build/outputs/bundle/release/app-release.aab artifacts/maalam-release.aab 2>/dev/null || true
          cp -v android/app/build/outputs/mapping/release/mapping.txt artifacts/mapping.txt 2>/dev/null || true
          {
            echo "Built by GitHub Actions run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "commit    : ${{ github.sha }}"
            echo "branch    : ${{ github.ref_name }}"
            echo "date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version   : $(grep appVersionName android/variables.gradle | head -1 | sed "s/.*= *//")  (versionCode $(grep appVersionCode android/variables.gradle | head -1 | sed "s/.*= *//"))"
            echo
            ls -la artifacts/ 2>/dev/null
            echo
            echo "Signing   : see the 'Prepare release signing' step log"
            echo "Install   : adb install -r maalam-debug.apk"
          } > artifacts/BUILD_INFO.txt
          cat artifacts/BUILD_INFO.txt

      - name: Publish to GitHub Releases
        if: steps.gradleDebug.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KS_B64: ${{ secrets.MAALAM_KEYSTORE_B64 }}
        run: |
          TAG="maalam-android-latest"
          FILES=()
          for f in artifacts/maalam-debug.apk artifacts/maalam-release.apk artifacts/maalam-release.aab artifacts/mapping.txt artifacts/BUILD_INFO.txt; do
            [ -f "$f" ] && FILES+=("$f")
          done
          NOTES="Automatic build of branch \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`.

          - **maalam-debug.apk** - install this one: \`adb install -r maalam-debug.apk\` (or open it on the phone). chrome://inspect works.
          - maalam-release.apk / .aab - R8-minified. Signed with an ephemeral CI key unless the MAALAM_KEYSTORE_* secrets are set, so the AAB is NOT Play-ready.
          - mapping.txt - R8 mapping for crash symbolisation.

          See maalam-android/TEST_REPORT.md for the device test matrix."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --target "${{ github.ref_name }}"
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY"               --target "${{ github.ref_name }}"               --title "Maalam Android - latest build"               --notes "$NOTES"
          fi
          echo "### Release" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the debug APK to the branch
        if: steps.gradleDebug.outcome == 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/maalam-debug.apk artifacts/BUILD_INFO.txt
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "artifacts: maalam-debug.apk from run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maalam-debug-apk
          path: maalam-android/artifacts/maalam-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maalam-release
          path: |
            maalam-android/artifacts/maalam-release.apk
            maalam-android/artifacts/maalam-release.aab
            maalam-android/artifacts/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job if Gradle failed
        if: always()
        run: |
          if [ "${{ steps.gradleDebug.outcome }}" != "success" ] || [ "${{ steps.gradleRelease.outcome }}" != "success" ]; then
            echo "Gradle failed - see the job summary above for the compiler output."
            exit 1
          fi
          echo "Both Gradle builds succeeded."
