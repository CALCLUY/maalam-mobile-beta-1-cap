<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Android build: no import map, no CDN.

      The web shell used to compile the core app at runtime through esm.sh and
      pull Tailwind, KaTeX CSS and Google Fonts from CDNs. Everything below is
      now bundled by Vite into ./assets, so the APK works with the network off:

        react / react-dom / lucide-react / @google/genai  -> npm, bundled
        @tailwindcss/browser (runtime JIT)                -> replaced by
                                                             @tailwindcss/vite
                                                             at build time
        katex CSS + its 60 font files                     -> npm import in
                                                             src/darija/board/Board.tsx
        Google Fonts                                      -> @fontsource/* in
                                                             src/fonts.ts
        logo (i.ibb.co)                                   -> public/logo.svg
        DODa CSVs (jsDelivr)                              -> src/assets/doda/*
        pdf.js worker (jsDelivr)                          -> pdfjs-dist asset

      The ONLY runtime network call left is the Gemini API, made with the
      user's own key.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maalam" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Maalam — معلّمك بالدارجة المغربية: يهضر معاك بالصوت، يكتب على السبورة، ويقرا الصور والـ PDF بما فيها المعادلات."
    />
    <title>Maalam — معلّمك بالدارجة مع السبورة</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <meta property="og:image" content="./logo.svg" />
    <style>
      /* Shown only when JavaScript is off, so the page is never blank. */
      .noscript {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #07090a;
        color: #eef2f0;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .noscript div {
        max-width: 26rem;
      }
      .noscript h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .noscript p {
        margin: 0;
        color: #8fa09a;
        font-size: 0.9rem;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <!-- The Maalam app mounts here (static import, see src/loader.ts). -->
    <div id="root"></div>
    <!-- Host loader / error screen. Pre-filled with the splash so it is the very
         first thing painted, before any JavaScript is downloaded or run. React
         swaps it for the identical live splash once it mounts.

         This markup is deliberately identical to the native splash
         (res/drawable/splash_icon.png on #0a0d0e), so the handover from the
         Android 12+ SplashScreen API to the first web frame is invisible. -->
    <div id="host">
      <div class="host host--splash" dir="rtl" id="boot">
        <div class="host__aurora" aria-hidden="true"><span></span><span></span></div>
        <div class="host__grid" aria-hidden="true"></div>
        <div class="host__splash">
          <div class="host__mascot">
            <div class="host__mascot-frame">
              <img class="host__mascot-img" src="./logo.svg" alt="" />
            </div>
          </div>
          <div class="host__splash-foot">
            <h1 class="host__splash-name" dir="ltr"><span class="host__splash-latin">maalam</span> <span class="host__splash-ar" lang="ar">معلم</span></h1>
            <span class="host__beta">BETA</span>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="noscript">
        <div>
          <h1>Maalam</h1>
          <p>
            هاد الصفحة خدامة بـ JavaScript. شغّلو فالمتصفح ديالك، ولا حطّو ف StackBlitz / Vercel باش يخدم.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
